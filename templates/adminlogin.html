<style>
    /* =====================================================
       ADMIN LOGIN POPUP MODAL
    ===================================================== */

    .admin-modal-overlay {
        position: fixed;
        inset: 0;
        z-index: 9999;

        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;

        background: rgba(5, 27, 56, 0.68);
        backdrop-filter: blur(4px);
    }

    .admin-modal-overlay.open {
        display: flex;
        animation: adminModalFadeIn 0.2s ease;
    }

    @keyframes adminModalFadeIn {
        from {
            opacity: 0;
        }
        to {
            opacity: 1;
        }
    }

    .admin-modal-card {
        width: 100%;
        max-width: 430px;

        background: #ffffff;
        border: 1px solid #c6d8ed;
        border-radius: 14px;
        overflow: hidden;

        box-shadow: 0 22px 55px rgba(4, 24, 52, 0.36);
        animation: adminModalSlideUp 0.22s ease;
    }

    @keyframes adminModalSlideUp {
        from {
            opacity: 0;
            transform: translateY(14px) scale(0.98);
        }
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    .admin-modal-header {
        background: linear-gradient(90deg, #063b78, #07549a);
        color: #ffffff;
        padding: 18px 22px;

        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
    }

    .admin-modal-title-group {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .admin-modal-icon {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.16);
        border: 1px solid rgba(255, 255, 255, 0.28);

        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        flex-shrink: 0;
    }

    .admin-modal-title-group h3 {
        font-size: 18px;
        font-weight: 800;
        line-height: 1.2;
        margin: 0;
    }

    .admin-modal-title-group p {
        font-size: 12px;
        color: #dbeafe;
        margin: 3px 0 0;
    }

    .admin-modal-close {
        width: 34px;
        height: 34px;
        border: 0;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.14);
        color: #ffffff;
        font-size: 18px;
        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s ease;
        flex-shrink: 0;
    }

    .admin-modal-close:hover {
        background: rgba(255, 255, 255, 0.26);
    }

    .admin-modal-body {
        padding: 24px 24px 26px;
    }

    .admin-login-alert {
        display: flex;
        align-items: center;
        gap: 10px;

        padding: 11px 14px;
        margin-bottom: 18px;

        border-radius: 8px;
        background: #fff0f0;
        border: 1px solid #efb6b6;
        color: #a32222;
        font-size: 13px;
        font-weight: 600;
    }

    .admin-form-group {
        margin-bottom: 16px;
    }

    .admin-form-group label {
        display: block;
        margin-bottom: 7px;
        color: #102b4c;
        font-size: 13px;
        font-weight: 700;
    }

    .admin-input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }

    .admin-input-icon {
        position: absolute;
        left: 13px;
        color: #07539a;
        font-size: 15px;
        pointer-events: none;
    }

    .admin-input-wrapper input {
        width: 100%;
        height: 44px;
        padding: 10px 42px 10px 39px;

        border: 1.5px solid #c6d8ed;
        border-radius: 8px;
        background: #f9fbfe;
        color: #102b4c;

        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .admin-input-wrapper input:focus {
        outline: none;
        background: #ffffff;
        border-color: #07549a;
        box-shadow: 0 0 0 3px rgba(7, 84, 154, 0.14);
    }

    .admin-password-toggle {
        position: absolute;
        right: 8px;
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: #46658a;
        cursor: pointer;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    .admin-password-toggle:hover {
        background: #e9f2ff;
        color: #063b78;
    }

    .admin-modal-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 22px;
    }

    .admin-login-submit {
        flex: 1;
        height: 44px;
        border: 0;
        border-radius: 8px;

        background: linear-gradient(90deg, #06417f, #07549a);
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        cursor: pointer;

        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        transition: transform 0.15s ease, box-shadow 0.2s ease;
    }

    .admin-login-submit:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 16px rgba(6, 59, 120, 0.28);
    }

    .admin-login-cancel {
        height: 44px;
        padding: 0 18px;
        border: 1.5px solid #c6d8ed;
        border-radius: 8px;
        background: #ffffff;
        color: #173a61;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        transition: background 0.2s ease;
    }

    .admin-login-cancel:hover {
        background: #f0f5fc;
    }
</style>

<div id="adminLoginModal"
     class="admin-modal-overlay{% if open_admin_login_modal %} open{% endif %}"
     role="dialog"
     aria-modal="true"
     aria-labelledby="adminLoginModalTitle">

    <div class="admin-modal-card">

        <div class="admin-modal-header">
            <div class="admin-modal-title-group">
                <div class="admin-modal-icon">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                    <h3 id="adminLoginModalTitle">Administration Login</h3>
                    <p>Electricity Department | Admin Portal</p>
                </div>
            </div>

            <button type="button"
                    class="admin-modal-close"
                    id="closeAdminLoginModalBtn"
                    aria-label="Close administration login modal">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="admin-modal-body">

            {% if admin_login_error %}
            <div class="admin-login-alert" role="alert">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span>{{ admin_login_error }}</span>
            </div>
            {% endif %}

            <form method="post" action="{% url 'admin_login' %}" id="adminLoginForm">
                {% csrf_token %}

                <div class="admin-form-group">
                    <label for="adminUsername">Admin Username</label>
                    <div class="admin-input-wrapper">
                        <i class="fa-solid fa-user-shield admin-input-icon"></i>
                        <input type="text"
                               id="adminUsername"
                               name="username"
                               value="{{ entered_username|default:'' }}"
                               placeholder="Enter admin username"
                               autocomplete="username"
                               required>
                    </div>
                </div>

                <div class="admin-form-group">
                    <label for="adminPassword">Password</label>
                    <div class="admin-input-wrapper">
                        <i class="fa-solid fa-lock admin-input-icon"></i>
                        <input type="password"
                               id="adminPassword"
                               name="password"
                               placeholder="Enter password"
                               autocomplete="current-password"
                               required>
                        <button type="button"
                                class="admin-password-toggle"
                                id="toggleAdminPassword"
                                aria-label="Show password">
                            <i class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="admin-modal-actions">
                    <button type="submit" class="admin-login-submit">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        <span>Login to Admin Home</span>
                    </button>

                    <button type="button"
                            class="admin-login-cancel"
                            id="cancelAdminLoginModalBtn">
                        Cancel
                    </button>
                </div>
            </form>

        </div>

    </div>

</div>

<script>
    (function () {
        const modal = document.getElementById('adminLoginModal');
        if (!modal) {
            return;
        }

        const closeBtn = document.getElementById('closeAdminLoginModalBtn');
        const cancelBtn = document.getElementById('cancelAdminLoginModalBtn');
        const usernameInput = document.getElementById('adminUsername');
        const passwordInput = document.getElementById('adminPassword');
        const togglePasswordBtn = document.getElementById('toggleAdminPassword');

        function openAdminLoginModal() {
            const navLinks = document.getElementById('navLinks');
            if (navLinks) {
                navLinks.classList.remove('open');
            }
            document.querySelectorAll('.nav-dropdown.open').forEach(function (dd) {
                dd.classList.remove('open');
            });
            if (typeof window.closeCreateAccountModal === 'function') {
                window.closeCreateAccountModal();
            }
            if (typeof window.closeUserLoginModal === 'function') {
                window.closeUserLoginModal();
            }
            if (typeof window.closeDeptLoginModal === 'function') {
                window.closeDeptLoginModal();
            }
            modal.classList.add('open');
            document.body.style.overflow = 'hidden';

            if (usernameInput) {
                setTimeout(function () {
                    if (usernameInput.value.trim() && passwordInput) {
                        passwordInput.focus();
                    } else {
                        usernameInput.focus();
                    }
                }, 40);
            }
        }

        function closeAdminLoginModal() {
            modal.classList.remove('open');
            document.body.style.overflow = '';
            if (window.location.hash === '#admin-login') {
                history.replaceState(null, '', window.location.pathname + window.location.search);
            }
        }

        window.openAdminLoginModal = openAdminLoginModal;
        window.closeAdminLoginModal = closeAdminLoginModal;

        document.querySelectorAll('a[href="#admin-login"], a[href$="/admin-login/"]').forEach(function (trigger) {
            trigger.addEventListener('click', function (event) {
                event.preventDefault();
                openAdminLoginModal();
            });
        });

        if (closeBtn) {
            closeBtn.addEventListener('click', closeAdminLoginModal);
        }

        if (cancelBtn) {
            cancelBtn.addEventListener('click', closeAdminLoginModal);
        }

        modal.addEventListener('click', function (event) {
            if (event.target === modal) {
                closeAdminLoginModal();
            }
        });

        document.addEventListener('keydown', function (event) {
            if (event.key === 'Escape' && modal.classList.contains('open')) {
                closeAdminLoginModal();
            }
        });

        if (togglePasswordBtn && passwordInput) {
            togglePasswordBtn.addEventListener('click', function () {
                const isHidden = passwordInput.type === 'password';
                passwordInput.type = isHidden ? 'text' : 'password';
                const icon = togglePasswordBtn.querySelector('i');
                if (icon) {
                    icon.className = isHidden ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
                }
                togglePasswordBtn.setAttribute(
                    'aria-label',
                    isHidden ? 'Hide password' : 'Show password'
                );
            });
        }

        if (modal.classList.contains('open') || window.location.hash === '#admin-login') {
            openAdminLoginModal();
        }
    })();
</script>
